# 백테스트 기간 (비우면 로드 시점 기준 6개월 전 ~ 오늘로 자동 설정)
period:
  start_date: ""
  end_date: ""

# 싱글 종목: 키워드로 후보를 좁힌 뒤 selected_code 1개만 매매
universe:
  market: "KOSPI"
  search_keyword: "삼성"   # "" 이면 시장 전체(후보 목록용)
  selected_code: "005930"

# 전략
strategy:
  interval: "daily"       # daily = 일봉, weekly = 주봉 (또는 일봉/주봉)
  ma_period: 20          # 매매 시그널 이평: 5, 10, 20 중 권장 (GUI 라디오와 동일)
  # 추세선 오버레이 (차트 PNG) — 체크한 기간만 표시 (매매 기준 N과 차트상 독립)
  show_trend_ma5: false
  show_trend_ma10: false
  show_trend_ma20: true
  show_trend_ma60: false
  show_trend_ma120: true
  show_trend_ma200: false
  # 차트 패널 표시 (GUI·YAML 공통, 기본 모두 true)
  show_chart_candle: true
  show_chart_volume: true
  show_chart_return: true
  # v4.0 매수 진입 필터 (시뮬 엔진 simulate_single.entry_filters)
  filter_trend_slope: false
  slope_threshold: 0.01
  filter_breakout_strength: false
  filter_time_buffer: false
  # v4.4 가변 고점 대비 낙폭 매도 (보유 중, 다음 봉 시가 청산)
  trailing_stop_enabled: false
  trailing_reference_pct: 10.0      # 피크 수익률 기준 %
  trailing_drop_below_pct: 3.0     # 미만 구간 적용 고점 대비 하락 %
  trailing_drop_above_pct: 5.0     # 기준 도달 후 적용 고점 대비 하락 %

# 매매 비용
trading_costs:
  buy_cost: 0.00015
  sell_cost: 0.0020

# 자산 (한 종목 전액)
portfolio:
  initial_cash: 5000000
