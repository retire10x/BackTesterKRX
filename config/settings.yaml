# 백테스트 기간 (비우면 로드 시점 기준 6개월 전 ~ 오늘로 자동 설정)
# v4.50: period_months=6 — UI 조회 구간 SSOT (MA120은 data_loader 180일 동적 버퍼)
period_months: 6
period:
  start_date: ""
  end_date: ""

# 싱글 종목: 키워드로 후보를 좁힌 뒤 selected_code 1개만 매매
universe:
  market: "KOSPI"
  search_keyword: ""   # GUI 최초 표시 및 시장 후보 필터
  selected_code: ""
  # 저장 시 고정 문자열(pipeline_and_v414). 예전 레거시 값(whole 등)도 로드 시 파이프라인 체크로 마이그레이션됨.
  screener_mode: "whole"
  # GUI v4.14: 검색 결과는 순차 AND — 시총 상위 컷(step1)·매수 규칙 터미널(step2)·김직선 1봉(step3)
  screener_pipeline:
    stage_mcap_top100: false    # 해당 시장 Marc 기준 상위 100종(키워드·유니버스와 교집합 후)
    stage_buy_rules: false      # 종료일 종봉: 골든+진입 필터 AND
    stage_kim_line_1bar: false  # 김직선 1봉 패턴(고가돌파·중심선지지)
  # 스크리너(랭킹) CLI 배치 등: 변동성 지표는 atr14(14일 ATR/종가 %)로 엔진 고정 — 아래 키는 하위 호환만
  screener:
    enabled: false
    lookback_trading_days: 20
    top_n: 100
    volatility_metric: "atr14"
    combine: "sum_rank_pct"
    min_market_cap_krw: 300000000000   # 최소 시가총액(원), 예: 3000억=3e11. FDR 상장표 근사. ETF 시장은 무시됨.
    hard_ma_pair_trend_filter: true  # 일봉 MA20 대 MA120·우상향 하드 게이트 후 스코어링
    # 고점대비 낙폭 순위화 전 클램프(%). 초과 구간은 랭크에서 과도 낙폭(급락·상투 가능성)으로 상대 패널티
    pullback_rank_cap_pct: 35.0

  # 슬로프 가속도 ablation: 시총 하한 종목별 baseline(False) vs slope_accel(True) 경량 배치
  slope_ablation_batch:
    min_market_cap_krw: 300000000000   # 0 또는 생략 시 universe.screener.min_market_cap_krw 폴백
    max_workers: 6

# 전략
strategy:
  interval: "daily"       # daily = 일봉, weekly = 주봉 (또는 일봉/주봉)
  ma_period: 20          # 매매 시그널 이평: 5, 10, 20 중 권장 (GUI 라디오와 동일)
  # v4.6 기본 크로스 스위치 (strategy.add_signals / simulate 데드 매도 실행). GUI 초기 선택은 모두 끔.
  golden_buy_enabled: false
  dead_cross_sell_enabled: false
  # 추세선 오버레이 (차트 PNG) — v3.15 GUI 5중 이평 토글(기본 모두 ON)
  show_trend_ma5: true
  show_trend_ma10: true
  show_trend_ma20: true
  show_trend_ma60: true
  show_trend_ma120: true
  show_trend_ma200: false
  # 차트 패널 표시 (GUI·YAML 공통)
  show_chart_candle: true
  show_chart_volume: true
  # v4.0 매수 진입 필터 (시뮬 엔진 simulate_single.entry_filters)
  filter_trend_slope: false
  slope_threshold: 0.01
  filter_breakout_strength: false
  filter_time_buffer: false
  # v4.4 가변 고점 대비 낙폭 매도 (보유 중, 다음 봉 시가 청산)
  trailing_stop_enabled: false
  trailing_reference_pct: 10.0      # 피크 수익률 기준 %
  trailing_drop_below_pct: 3.0     # 미만 구간 적용 고점 대비 하락 %
  trailing_drop_above_pct: 5.0     # 기준 도달 후 적용 고점 대비 하락 %
  harness_buy_all_three_and: false  # true 면 매수 진입 시 대세·돌파강도·시간버퍼 무조건 AND (harness 정합)
  # True 시 최근 5봉 MA20 값에 대한 OLS 기울기가 0보다 클 때만 매수 허용(단기 우상향 곡선 게이트)
  use_slope_acceleration: false
trading_costs:
  buy_cost: 0.00015
  sell_cost: 0.0020

# 자산 (한 종목 전액)
portfolio:
  initial_cash: 5000000

# v3.0 Overnight Scalper (CLI: python main.py --mode cli --config config/settings.yaml)
v3_0:
  universe_limit: 300
  volume_burst_multiple: 1.5
  vol_shrink_limit: 0.8
  # v3.90 장기 대세(종가>MA60·MA120 듀얼 AND · MA5≥MA10) — 스캔·백테스트 공통
  kim_trend_filter: true
  # true: Pass5(MA5>=MA10, 기본 ON) / false: Pass4(듀얼 정배열)까지만
  use_momentum_filter: true
  # v4.00 유동성 안전장치 (원화 SSOT) — Pass 0
  min_liquidity_market_cap_krw: 50000000000    # 500억
  min_liquidity_trade_amount_krw: 1000000000     # 10억

# v4.0 스마트머니 포트폴리오 (run_v4_portfolio.py · portfolio_manager SSOT)
# ★ Phase H 동결 (h2_sl03_tp10_ec20 · field_test) — Phase I 폐기 · main 병합 보류
# Ruin 서면: docs/v4_ruin_analysis.md
v4_0:
  environment:
    mode: "field_test"                 # 10만 원 실전 소액 필드 테스트 모드 고정
    initial_cash: 100000
  engine:
    phase_mode: "h"                    # Phase H 쌍바닥 엔진 고정 (Phase G/I 미사용)
  portfolio:
    initial_cash: 100000
    max_slots: 2                       # 슬롯당 5만 원 고정 배분
  strategy:
    field_test_invest_amount: 50000
    fixed_invest_amount: 10000000      # Phase G 레거시 (field_test 시 5만 사용)
    stock_price_floor: 1000            # 동전주 배제
    stock_price_ceiling: 20000         # 1주 2만 원 이하 (황제주컷 20%와 병행)
    max_track_days: 30
    max_daily_cash_deploy_ratio: 0.45  # 당일 현금 배분 상한 (연속 손절 방어)
    # [★ 통계 검증 Phase H 최적 — h2_sl03_tp10_ec20]
    nuliim_ratio: 0.04                 # Phase G 레거시 키 (H 진입은 쌍바닥·5영업일 관망)
    stop_loss_ratio: 0.03              # Phase H SL -3% (확장 금지)
    target_profit_ratio: 0.10          # Phase H TP +10%
    max_hold_days: 5                   # Phase H 5일 타임스탑
    emperor_cap_ratio: 0.20            # 황제주컷 20% → 5만×20%=1.5만/주 상한
    phase_h_min_wait_bdays: 5          # 기준봉 후 5영업일 관망
    min_invest_amount: 100000          # YAML 명세 (field_test 시 엔진이 5만·85%로 캡)
  costs:
    buy_fee: 0.00015
    sell_fee_tax: 0.0018

# v5.0 20일선 변곡점 스나이퍼 (run_v5_portfolio.py · v5_config SSOT)
# 원칙: 20일선 하부 바닥권 → 20영업일 전 종가 돌파(변곡) 종가 진입 · MA20 이탈 청산
# v4_0 Phase H/I·고정 손익비와 분리 — main 병합 금지
v5_0:
  environment:
    mode: "field_test"                 # 10만 원 소액 실전 테스트 모드
    initial_cash: 100000

  portfolio:
    max_slots: 2                      # 슬롯당 5만 원 단리 고정 베팅
    slot_invest_amount: 50000
    trading_costs:
      buy_cost_ratio: 0.00015         # 매수 수수료 0.015%
      sell_cost_ratio: 0.00195        # 매도 수수료 + 세금 약 0.195%

  strategy:
    strategy_name: "ma_inflection_sniper"
    lookback_window: 20               # 변곡점 판정·20영업일 전 종가 저항선
    exit_ma_window: 20                  # 종가 < MA20 시 추세 붕괴 청산
    price_ceiling: 20000              # 1주 2만 원 초과 진입 제한
    price_floor: 1000                 # 동전주 배제

# v5.1 고정 코스닥 탄력주 유니버스 (run_v5_breakout.py · v5_1 SSOT)
# 원칙: 사전 박제 JSON 풀만 순회 — Look-ahead 방지를 위해 lock_date 시점만 스캔
v5_1:
  environment:
    mode: "field_test"
    initial_cash: 100000
    universe_profile: "config/kosdaq_sniper_universe.json"
    # [★ 유니버스 락] 백테스트 시작(2023-01-01) 직전 영업일 기준 1회 박제 — 당일/미래 시총·수급 금지
    universe_lock:
      lock_date: "2022-12-29"           # 백테스트 전날 스냅샷 (생존·미래참조 편향 차단)
      backtest_start: "2023-01-01"      # lock_date < backtest_start 검증용
      market: "KOSDAQ"
      min_mcap_krw: 70000000000        # 700억 이상
      max_mcap_krw: 300000000000       # 3,000억 이하
      top_n: 40                         # 거래대금 상위 40
      min_trade_krw: 5000000000        # 당일 거래대금 하한 50억 (절대 기준)

  portfolio:
    max_slots: 2
    slot_invest_amount: 50000
    trading_costs:
      buy_cost_ratio: 0.00015
      sell_cost_ratio: 0.00195

  strategy:
    strategy_name: "ma_inflection_sniper"
    lookback_window: 20
    exit_ma_window: 20

# python run_v5_breakout.py              # 스캔·실행 각각 질문
# python run_v5_breakout.py --no-scan    # 기존 JSON, 실행만 질문
# python run_v5_breakout.py --scan-universe --yes   # CI/자동화 전용(질문 생략)

# v5.2 변곡점 Hit & Run — 동일 40종 유니버스 · 고정 손익비 청산 (MA20 추세청산 제거)
v5_2:
  environment:
    mode: "field_test"
    initial_cash: 100000
    universe_profile: "config/kosdaq_sniper_universe.json"
    # v5_1 과 동일 락 (스캔·Look-ahead 검증 SSOT)
    universe_lock:
      lock_date: "2022-12-29"
      backtest_start: "2023-01-01"
      market: "KOSDAQ"
      min_mcap_krw: 70000000000
      max_mcap_krw: 300000000000
      top_n: 40
      min_trade_krw: 5000000000

  portfolio:
    max_slots: 2
    slot_invest_amount: 50000
    trading_costs:
      buy_cost_ratio: 0.00015
      sell_cost_ratio: 0.00195

  strategy:
    strategy_name: "ma_inflection_hit_and_run"
    lookback_window: 20
    target_profit_ratio: 0.06          # +6% 익절 (손익비 2.0)
    stop_loss_ratio: 0.03              # -3% 손절
    max_hold_days: 3                   # 3영업일 타임스탑

v5_3:
  environment:
    mode: "field_test"
    initial_cash: 100000
    relay_interval_months: 6
    universe_dir: "config/relay_universes/"

  portfolio:
    max_slots: 2
    slot_invest_amount: 50000
    trading_costs:
      buy_cost_ratio: 0.00015
      sell_cost_ratio: 0.00195

  strategy:
    strategy_name: "ma_inflection_relay_sniper"
    lookback_window: 20
    target_profit_ratio: 0.06
    stop_loss_ratio: 0.03
    max_hold_days: 3
    screener:
      market: "KOSDAQ"
      min_market_cap: 70000000000
      max_market_cap: 300000000000
      min_daily_volume_amt: 5000000000
      top_n_limit: 40

# v5.4 릴레이 + 장기 이평 대세 필터 (변곡 AND 종가 > MA60/120)
v5_4:
  environment:
    mode: "field_test"
    initial_cash: 100000
    relay_interval_months: 6
    universe_dir: "config/relay_universes/"

  portfolio:
    max_slots: 2
    slot_invest_amount: 50000
    trading_costs:
      buy_cost_ratio: 0.00015
      sell_cost_ratio: 0.00195

  strategy:
    strategy_name: "ma_inflection_with_macro_filter"
    lookback_window: 20
    target_profit_ratio: 0.06
    stop_loss_ratio: 0.03
    max_hold_days: 3
    macro_trend_filter:
      enabled: true
      ma_window: 120                   # 60(수급선) 또는 120(경기선)
    screener:
      market: "KOSDAQ"
      min_market_cap: 70000000000
      max_market_cap: 300000000000
      min_daily_volume_amt: 5000000000
      top_n_limit: 40

# # 1) 7구간 유니버스만 박제 (수 분~수십 분, KRX/FDR)
# .\venv\Scripts\python.exe run_v5_relay_portfolio.py --section v5_4
# .\venv\Scripts\python.exe run_v5_relay_portfolio.py --scan-only
# # 2) 대화형: 스캔 Y/N → 백테스트 Y/N
# .\venv\Scripts\python.exe run_v5_relay_portfolio.py
# # 3) 기존 JSON으로 바로 백테스트
# .\venv\Scripts\python.exe run_v5_relay_portfolio.py --yes      